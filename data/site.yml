      zh: 核心贡献者 &middot; Detection Transformer 系列（2.x 与 3.x）
    blurb:
      en: The most widely used object detection toolbox; I rebuilt its DETR family.
      zh: 使用最广泛的目标检测工具箱，我重构了其中的 DETR 系列。

