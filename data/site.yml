profile:
  name_zh: 刘祎铭
  name_en: Yiming Liu
  tagline:
    en: Researcher @ Tencent Hunyuan.
    zh: 腾讯混元 · 研究员
  portrait: assets/img/portrait.jpg
  links:
    - { kind: email, label: Email, handle: "letusgo126@gmail.com", url: "mailto:letusgo126@gmail.com" }
    - { kind: github, label: GitHub, handle: "github.com/LYMDLUT", url: "https://github.com/LYMDLUT" }
    - { kind: openreview, label: OpenReview, url: "https://openreview.net/profile?id=~Yiming_Liu15" }
    - kind: cv
      label: { en: CV, zh: 简历 }
      url: { en: "assets/cv/Yiming_Liu_CV_en.pdf", zh: "assets/cv/Yiming_Liu_CV_zh.pdf" }
  about:
    en: |
      <p>
        I am a Researcher at <strong>Tencent Hunyuan</strong>, where we work on
        <strong>LLM evaluation</strong>. Prior to this, I worked on object detection,
        diffusion models, and RL infrastructure.
      </p>
      <p>
        I received my M.Eng. in Computer Vision from
        <a href="https://www.sysu.edu.cn/">Sun Yat-sen University</a> in 2025, advised by
        <a href="https://www.linliang.net/">Prof. Liang Lin</a> at the
        <a href="https://www.sysu-hcp.net/">HCP Lab</a>, and my B.Eng. in Electronic and
        Information Engineering from
        <a href="https://www.dlut.edu.cn/">Dalian University of Technology</a> in 2022.
      </p>
    # Chinese paragraphs stay on one line: a newline inside CJK text renders as
    # an unwanted space in HTML.
    zh: |
      <p>我是<strong>腾讯混元</strong>的研究员，目前在做<strong>大模型评测</strong>。在此之前做过目标检测、扩散模型和 RL 基础设施。</p>
      <p>2025 年于<a href="https://www.sysu.edu.cn/">中山大学</a>获计算机视觉硕士学位，导师为<a href="https://www.sysu-hcp.net/">人机物智能融合实验室（HCP Lab）</a>的<a href="https://www.linliang.net/">林倞</a>教授；2022 年于<a href="https://www.dlut.edu.cn/">大连理工大学</a>获电子信息工程学士学位。</p>

# The spine of the page: one entry per chapter, newest first.
timeline:
  - period: { en: Jul 2025 &ndash; now, zh: 2025 年 7 月 &ndash; 至今 }
    tag: Hunyuan
    tag_kind: now
    title: { en: LLM Evaluation, zh: 大模型评测 }
    org: { en: Tencent Hunyuan, zh: 腾讯混元 }
    body:
      en: |
        <p>
          We work on evaluating large language and multimodal models at Tencent Hunyuan,
          including benchmarks such as <strong>jy-crpg-bench</strong>,
          <strong>VisualNeedle</strong>, <strong>EternalMath</strong>, and
          <strong>DramaChain Bench</strong>, as well as automated scoring and attribution
          pipelines for image and video generation (<strong>Q-Save</strong>).
        </p>
      zh: |
        <p>在腾讯混元做大语言模型与多模态模型的评测，包括 <strong>jy-crpg-bench</strong>、<strong>VisualNeedle</strong>、<strong>EternalMath</strong>、<strong>DramaChain Bench</strong> 等基准，以及图像与视频生成的自动打分与归因流水线（<strong>Q-Save</strong>）。</p>
    links:
      - { label: jy-crpg-bench, url: "https://hanxiao.io/jy-crpg-bench/" }
      - { label: VisualNeedle, url: "https://arxiv.org/abs/2605.26380" }
      - { label: Q-Save, url: "https://arxiv.org/abs/2511.18825" }
      - { label: DramaChain Bench, url: "https://arxiv.org/abs/2609.00646" }
      - { label: EternalMath, url: "https://arxiv.org/abs/2601.01400" }

  - period: { en: Sep 2024 &ndash; now, zh: 2024 年 9 月 &ndash; 至今 }
    tag: OpenRLHF
    tag_kind: code
    title: { en: RL Infrastructure &amp; KL Regularization, zh: RL 基础设施与 KL 正则 }
    org: OpenRLHF
    body:
      en: |
        <p>
          Developed KL-loss algorithms and distributed training backends (DeepSpeed AutoTP,
          FSDP2&nbsp;+&nbsp;CP&nbsp;+&nbsp;TP) in
          <a href="https://github.com/OpenRLHF/OpenRLHF">OpenRLHF</a>. Identified the
          gradient bias of using the <code>k3</code> estimator as a loss in GRPO and
          proposed the unbiased <code>k2</code> loss (cited by REINFORCE++), formalized in
          <em>Rethinking KL Regularization in RLHF</em>.
        </p>
      zh: |
        <p>在 <a href="https://github.com/OpenRLHF/OpenRLHF">OpenRLHF</a> 中开发 KL 损失算法与分布式训练后端（DeepSpeed AutoTP、FSDP2&nbsp;+&nbsp;CP&nbsp;+&nbsp;TP）。首次发现 GRPO 中把 <code>k3</code> 估计量直接当作损失函数会带来梯度有偏，提出无偏的 <code>k2</code> loss（被 REINFORCE++ 引用），并总结为 <em>Rethinking KL Regularization in RLHF</em>。</p>
    links:
      - { label: OpenRLHF, url: "https://github.com/OpenRLHF/OpenRLHF" }
      - { label: { en: EMNLP 2025 paper, zh: EMNLP 2025 论文 }, url: "https://aclanthology.org/2025.emnlp-demos.48/" }
      - { label: Rethinking KL Regularization, url: "https://arxiv.org/abs/2510.01555" }

  - period: { en: Mar 2023 &ndash; Apr 2025, zh: 2023 年 3 月 &ndash; 2025 年 4 月 }
    tag: ICLR 2025
    tag_kind: paper
    title: { en: Diffusion-Based Adversarial Purification, zh: 基于扩散模型的对抗净化 }
    org: { en: "HCP Lab, Sun Yat-sen University", zh: 中山大学 HCP Lab }
    body:
      en: |
        <p>
          Showed from a stochastic perspective that diffusion-based purification defends
          through randomness rather than KL contraction or Gaussian noise masking, while
          its local loss landscape remains non-flat. Proposed diffusion denoising
          adversarial training to smooth the loss landscape across DDPM, DDIM, VP-SDE, and
          EDM.
        </p>
      zh: |
        <p>从随机性的角度指出，扩散净化的防御能力来自随机性，而非既有研究认为的「前向加噪减小 KL 散度」或「高斯噪声的掩盖效应」，且其 Loss landscape 局部并不平坦。提出扩散去噪对抗训练，在 DDPM、DDIM、VP-SDE、EDM 上平滑 Loss landscape 并一致提升鲁棒性。</p>
    links:
      - { label: OpenReview, url: "https://openreview.net/forum?id=shqjOIK3SA" }
      - { label: arXiv, url: "https://arxiv.org/abs/2404.14309" }

  - period: { en: Jul 2022 &ndash; Mar 2023, zh: 2022 年 7 月 &ndash; 2023 年 3 月 }
    tag: MMDetection
    tag_kind: code
    title: { en: Detection Transformers in MMDetection, zh: MMDetection 中的 Detection Transformer }
    org: { en: Shanghai AI Laboratory, zh: 上海人工智能实验室 }
    body:
      en: |
        <p>
          Core contributor to the Detection Transformer (<code>refactor-detr</code>)
          refactor across <a href="https://github.com/open-mmlab/mmdetection">MMDetection</a>
          2.x and 3.x. Simplified the registry and inheritance hierarchy, unified module
          data structures, re-implemented Conditional DETR, DAB-DETR, and DINO with strict
          metric alignment, and presented the work at an OpenMMLab community talk.
        </p>
      zh: |
        <p><a href="https://github.com/open-mmlab/mmdetection">MMDetection</a> 2.x 与 3.x 中 Detection Transformer 系列重构（<code>refactor-detr</code>）的核心贡献者。简化注册机制与继承层级，统一模块数据结构，重新实现 Conditional DETR、DAB-DETR 和 DINO 并严格对齐指标，并受邀在 OpenMMLab 社区开放麦上分享这项工作。</p>
    links:
      - { label: refactor-detr, url: "https://github.com/open-mmlab/mmdetection/tree/refactor-detr" }

